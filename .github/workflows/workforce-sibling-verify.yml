name: Workforce sibling verify

on:
  pull_request:
    branches:
      - workforce/main
    paths:
      - 'packages/workforce/**'
      - 'packages/bundle/workforce-cell/**'
      - '.github/workflows/workforce-sibling-verify.yml'
      - '.github/actions/checkout-workforce-sibling/**'
      - '.github/workforce-platform-pin'

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  tool-admission:
    name: workforce-platform sibling / tool admission
    runs-on: ubuntu-latest
    steps:
      - name: Require cross-repo checkout token
        if: secrets.WORKFORCE_PLATFORM_CHECKOUT_TOKEN == ''
        run: |
          echo "::error::Set repository secret WORKFORCE_PLATFORM_CHECKOUT_TOKEN (read access to Tim-ReJet/workforce-platform). See packages/workforce/WORKFORCE_PLATFORM.md."
          exit 1

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/checkout-workforce-sibling
        with:
          token: ${{ secrets.WORKFORCE_PLATFORM_CHECKOUT_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install harness (immutable)
        run: pnpm install --frozen-lockfile

      - name: Install workforce-platform workspace
        working-directory: workforce-platform
        run: pnpm install --frozen-lockfile

      - name: Tool admission and workforce-cell startup tests
        run: >-
          pnpm exec vitest run
          packages/workforce/tool-admission/tests/tool-admission.spec.ts
          packages/bundle/workforce-cell/tests/startup.spec.ts

      - name: Host TypeScript build
        run: pnpm exec tsc -b tsconfig.host.json
