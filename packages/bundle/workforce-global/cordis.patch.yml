# The dsh-workforce-global bundle patch: the Workforce global profile layer,
# stacked over dsh-base. Later Workforce tasks add their own `insert` rows
# here as their packages land; do not add a @workforce/* dependency ahead of
# the package that justifies it (an unresolvable workspace dependency breaks
# `pnpm install` for the whole repository).

- insert:
    # Durable WorkOrder binding for a Workforce Session: the
    # workforce/workorder-bound SessionEvent plus its folded
    # workforceSessionBinding projection over ctx.sessionProjections.
    - id: workforce-session-events
      name: '@deepseek-ai/dsh-workforce-session-events'
